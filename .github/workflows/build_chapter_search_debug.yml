name: Build chapter search debug APK

on:
  push:
    branches:
      - master
    paths:
      - 'app/src/main/java/eu/kanade/presentation/manga/**'
      - 'i18n/src/commonMain/moko-resources/**'
      - '.github/workflows/build_chapter_search_debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter-search-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Compile debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-chapter-search-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
